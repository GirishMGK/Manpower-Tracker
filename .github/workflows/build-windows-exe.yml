name: Build Windows desktop app

# Produces a Windows installer (FirmRMS-Setup.exe) for firm-rms as a
# downloadable Actions artifact. PyInstaller can't cross-compile a Windows
# binary from Linux/macOS, so this has to run on a windows-latest runner —
# that's the whole reason this is a workflow and not a local script.
#
# Trigger it from the Actions tab ("Build Windows desktop app" ->
# "Run workflow"), or push a tag like "v1.0.0" to also attach the installer
# to a GitHub Release.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify VERSION matches the pushed tag
        # "Check for updates" (app/api/v1/updates.py) compares the running
        # exe's bundled VERSION file against the latest GitHub Release tag —
        # if a release ever ships with a VERSION that doesn't match its own
        # tag, every older exe would either nag forever or never notice an
        # update. Catch that here instead of after it ships.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $fileVersion = (Get-Content VERSION -Raw).Trim()
          if ($tagVersion -ne $fileVersion) {
            Write-Error "Tag ${{ github.ref_name }} does not match VERSION file ('$fileVersion') — bump VERSION and commit before tagging."
            exit 1
          }
          Write-Host "VERSION file ($fileVersion) matches tag ${{ github.ref_name }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build firm-rms.exe (PyInstaller)
        run: pyinstaller desktop/firm_rms.spec --noconfirm

      - name: Smoke-test the packaged exe
        run: |
          # Redirect the exe's own console output to files (it's a console
          # build — see firm_rms.spec's console=True) so a failure here
          # shows the real Python traceback, not just "no response".
          $proc = Start-Process -FilePath "dist\firm-rms\firm-rms.exe" `
            -RedirectStandardOutput "exe-stdout.log" -RedirectStandardError "exe-stderr.log" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { break }
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          Write-Host "---- firm-rms.exe stdout ----"
          Get-Content "exe-stdout.log" -ErrorAction SilentlyContinue
          Write-Host "---- firm-rms.exe stderr ----"
          Get-Content "exe-stderr.log" -ErrorAction SilentlyContinue

          if (-not $ok) {
            Write-Error "firm-rms.exe did not respond on :8000/health (exited early: $($proc.HasExited), exit code: $($proc.ExitCode))"
            exit 1
          }
          Write-Host "firm-rms.exe started and responded to /health OK"

          $fileVersion = (Get-Content VERSION -Raw).Trim()
          $healthVersion = $resp.Content | ConvertFrom-Json | Select-Object -ExpandProperty version
          if ($healthVersion -ne $fileVersion) {
            Write-Error "/health reported version '$healthVersion' but VERSION file says '$fileVersion' — the bundled VERSION data file didn't make it into the exe."
            exit 1
          }
          Write-Host "/health correctly reports version $healthVersion"

      - name: Build installer (Inno Setup)
        run: iscc desktop\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: FirmRMS-Setup
          path: dist-installer/FirmRMS-Setup.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/FirmRMS-Setup.exe
