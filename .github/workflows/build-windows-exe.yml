name: Build Windows desktop app

# Produces a Windows installer (FirmRMS-Setup.exe) for firm-rms as a
# downloadable Actions artifact. PyInstaller can't cross-compile a Windows
# binary from Linux/macOS, so this has to run on a windows-latest runner —
# that's the whole reason this is a workflow and not a local script.
#
# Trigger it from the Actions tab ("Build Windows desktop app" ->
# "Run workflow"), or push a tag like "v1.0.0" to also attach the installer
# to a GitHub Release.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build firm-rms.exe (PyInstaller)
        run: pyinstaller desktop/firm_rms.spec --noconfirm

      - name: Smoke-test the packaged exe
        run: |
          $proc = Start-Process -FilePath "dist\firm-rms\firm-rms.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force
          if (-not $ok) {
            Write-Error "firm-rms.exe did not respond on :8000/health within 60s"
            exit 1
          }
          Write-Host "firm-rms.exe started and responded to /health OK"

      - name: Build installer (Inno Setup)
        run: iscc desktop\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: FirmRMS-Setup
          path: dist-installer/FirmRMS-Setup.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/FirmRMS-Setup.exe
