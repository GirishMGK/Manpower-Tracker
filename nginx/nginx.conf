# Single front door for the stack: routes /api to FastAPI, everything else
# to the SPA container. This is the "nginx" box in the fixed stack (§1);
# it is a thin router, not where business logic or auth lives.
server {
    listen 80;
    server_name _;

    client_max_body_size 25m;  # bulk Excel imports (§10)

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
